[tool.poetry]
name = "exhibition-vm-controller"
version = "2.1.0"
description = "Framework for conservation and autonomous exhibition operation of historical digital artworks using VMs with snapshot-based error recovery"
authors = ["Marc Schütze <mschuetze@zkm.de>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/zkmkarlsruhe/exhibition-vm-controller"
repository = "https://github.com/zkmkarlsruhe/exhibition-vm-controller"
keywords = ["digital-art", "conservation", "virtualization", "museum", "exhibition"]
packages = [{ include = "vm_controller" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Emulators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.11"  # vmctl-core (bundle format + import) requires >=3.11
fastapi = "^0.165.0"  # 0.109 shipped a starlette whose TestClient predates httpx 0.28
uvicorn = {extras = ["standard"], version = "^0.54.0"}
pyyaml = "^6.0.4"
pydantic = "^2.14.4"
pydantic-settings = "^2.16.3"
pyserial = {version = "^3.5", optional = true}
# Shared core, on two seams now: the exhibition handoff (promotion bundle format —
# verify/pack/unpack, the same seam rvmc writes with, so catalog + importer can't drift
# from it) AND the VM backend + plugin spec/runtime. A plugin authored against the shared
# spec in the research workbench runs UNCHANGED here. The dependency arrow is
# exhibition -> vmctl-core only (NEVER exhibition -> research). develop=true so local edits
# to the core are live; a standalone checkout without the sibling pins a released version.
vmctl-core = { path = "../../vmctl-core", develop = true }

[tool.poetry.group.dev.dependencies]
# Current, and matched to the rest of the family so one `ruff format` means the same thing in
# every repo. black is gone (ruff formats); the old pins here were 2-3 majors behind because
# nothing ever ran them — see the CI check job this arrived with.
pytest = "^9.2.0"
pytest-asyncio = "^1.5.0"
ruff = "^0.17.6"
mypy = "^2.4.1"
types-PyYAML = "^6.0"
httpx = "^0.28.1"  # fastapi's TestClient transport

[tool.poetry.scripts]
exhibition-vm-controller = "vm_controller.api:main"
vm-controller = "vm_controller.api:main"
evmctl-catalog = "vm_controller.catalog:main"
evmctl-import = "vm_controller.importer:main"
vmctl = "vm_controller.api:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# black is gone: ruff formats, and running two formatters over one tree is how a file ends up
# reformatted twice per commit. Same line length, so the result is unchanged.

[tool.pytest.ini_options]
# Collect ONLY tests/. Without this, any top-level script named test_*.py is collected as a
# test suite: tools/mock_heartbeat.py used to be test_heartbeat.py, and CI died on its
# `import requests` — a dependency the application does not have and does not want.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"  # matches requires-python; py310 was left over from before the core dep

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "TID"]  # shared vmctl baseline, see docs.vmctl.org/contributing/engineering/
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
# runs inside Windows XP guests on Python 3.4: no pyupgrade rewrites (f-strings, PEP 604/585)
"conservation/guest_agent/*" = ["UP"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
