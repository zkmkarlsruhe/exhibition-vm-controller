# Conservation front door — containerized, nginx-unprivileged (runs as non-root,
# listens on 8080 inside the container). The Docker daemon publishes it on
# 192.168.122.1:80 (VM network only), so nothing binds a privileged port as root.
#
# Routes by Host header:
#   - the gateway IP (controller / heartbeat / artwork content) -> host controller
#   - anything else (a redirected dead host)                     -> archive server
#
# The OPERATOR UIs (controller /ui, kiosk, traffic) are NOT here — reach them on
# their localhost ports over an SSH tunnel. This door is guest-facing only.

upstream cons_archive { server archive:8081; }                  # archive container (bridge DNS)
upstream cons_ctrl    { server host.docker.internal:8002; }     # host controller

server {
    listen 8080;
    server_name 192.168.122.1;          # controller traffic: heartbeat, artwork content

    reset_timedout_connection on;       # snapshot reverts leave half-open conns
    keepalive_timeout 0;

    location / {
        proxy_pass http://cons_ctrl;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 8080 default_server;         # any other Host = a redirected dead host
    server_name _;

    location / {
        proxy_pass http://cons_archive;
        proxy_set_header Host $host;     # keep the dead host for the archive lookup
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
