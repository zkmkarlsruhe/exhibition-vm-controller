# Exhibition VM Controller - nginx reverse proxy
# Routes VM traffic to the correct FastAPI instance based on source IP.
#
# Each artwork VM has a static DHCP reservation (see libvirt default network)
# and its own FastAPI instance running on a dedicated port.
#
# Install:
#   sudo ln -s /x/coding/exhibition-vm-controller/deployment/nginx/exhibition-vms.conf \
#       /etc/nginx/sites-enabled/exhibition-vms.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream artwork_vm {
    server 127.0.0.1:8002;
}

server {
    listen 192.168.122.1:80;

    # VM snapshot reverts create half-open TCP connections.
    # These settings ensure stale connections are reset quickly.
    reset_timedout_connection on;
    keepalive_timeout 0;
    lingering_close off;

    location / {
        proxy_pass http://artwork_vm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection close;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
    }
}
