# Conservation archive serving — the no-privilege "transparent-ish" path.
#
# A dead host is pointed at the gateway (192.168.122.1) by the guest's hosts file
# or the DNS responder, so its request arrives at nginx :80 with the dead host in
# the Host header. This block is the `default_server`, so any Host that ISN'T the
# controller falls through to the archive server (an UNPRIVILEGED high port,
# 127.0.0.1:8081). nginx already owns :80 — so there's NO iptables, NO sudoers,
# NO root, and no privileged bind by our own process.
#
# Compose with the controller config (deployment/nginx/exhibition-vms.conf):
#   - give the controller's server block an explicit `server_name 192.168.122.1;`
#     so guest -> controller traffic (heartbeat, artwork) matches it specifically,
#   - keep THIS block as `default_server` for everything else (the dead hosts).
#
# Run the backend (containerized, unprivileged):
#   docker compose run -d --rm tools archive --listen 127.0.0.1 --port 8081
#
# Install:
#   sudo ln -s .../deployment/nginx/conservation-archive.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream cons_archive { server 127.0.0.1:8081; }

server {
    listen 192.168.122.1:80 default_server;
    server_name _;

    # VM snapshot reverts leave half-open TCP connections — reset them fast.
    reset_timedout_connection on;
    keepalive_timeout 0;

    location / {
        proxy_pass http://cons_archive;
        proxy_set_header Host $host;          # keep the dead host for the archive lookup
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
